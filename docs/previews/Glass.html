<!-- @dsCard group="Foundations" height=320 subtitle="Frosted stack: resting, strong, lift" -->
<!doctype html>
<html><head>
<link rel="stylesheet" href="../../dist/brolly.css">
<script src="../../dist/brolly.js"></script>
<script>try{var t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script><meta charset="utf-8">
<style>html,body{margin:0}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.g p{margin:6px 0 0}</style></head>
<body>
<div class="br-stage" style="min-height:100vh;padding:36px">
  <div class="g">
    <div class="br-glass br-glass--pad"><div class="br-label">Resting</div><h3 class="br-h3" style="margin-top:6px">glass</h3><p class="br-small">Cards, rows, tiles. Blur 20, saturate 160%, a bright rim top-left.</p></div>
    <div class="br-glass br-glass--strong br-glass--pad"><div class="br-label">Floating</div><h3 class="br-h3" style="margin-top:6px">glass-strong</h3><p class="br-small">Anything above other glass: menus, island, command bar. Near-opaque.</p></div>
    <div class="br-glass br-glass--lift br-glass--pad" tabindex="0"><div class="br-label">Hover me</div><h3 class="br-h3" style="margin-top:6px">glow-lift</h3><p class="br-small">Lifts two pixels and swaps its grey shadow for a violet glow.</p></div>
  </div>
</div>
<script>Brolly.init();</script>
</body></html>
