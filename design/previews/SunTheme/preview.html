<!-- @dsCard group="Motion" height=380 subtitle="Dawn, noon, dusk, night. Drag the clock." -->
<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}</style></head>
<body>
<div class="br-stage" style="min-height:100vh;padding:32px">
  <div class="br-glass br-glass--pad" style="max-width:560px">
    <div class="br-label">The clock</div>
    <h2 class="br-h1" id="n" style="margin:6px 0 4px">Dawn</h2>
    <p class="br-wit" id="w" style="margin:0 0 18px"></p>
    <label class="br-slider"><span class="br-slider__top"><span>Time of day</span><output id="o"></output></span><input id="s" type="range" min="0" max="23.75" step="0.25" value="7"/></label>
    <div class="row"><button class="br-btn br-btn--sm" id="auto">Use real time</button><span class="br-caption" style="align-self:center">Local time sets the theme automatically.</span></div>
  </div>
</div>
<script>
Brolly.init();
var s=document.getElementById('s');
function f(h){var H=Math.floor(h),M=Math.round((h-H)*60);return ('0'+H).slice(-2)+':'+('0'+M).slice(-2);}
function upd(h){var b=Brolly.sun.band(h);document.getElementById('n').textContent=b.name;document.getElementById('w').textContent=b.wit;document.getElementById('o').textContent=f(h);Brolly.sun.apply(b.id);}
s.addEventListener('input',function(){upd(+s.value);});
document.getElementById('auto').addEventListener('click',function(){var h=Brolly.sun.hours();s.value=h;Brolly.Field.slider(s);upd(h);});
upd(7);
</script>
</body></html>
