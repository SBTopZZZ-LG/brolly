<!-- @dsCard group="Lists" height=520 subtitle="Drag a soft rectangle; a bulk bar rises" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0}</style></head>
<body>
<div class="br-stage" style="min-height:100vh;padding:28px 32px 100px">
  <p class="br-small" style="margin:0 0 14px;max-width:640px">Drag on the empty space around the rows. <kbd class="br-key">Shift</kbd> adds, <kbd class="br-key">⌘ A</kbd> selects all, <kbd class="br-key">Esc</kbd> clears. Delete is hold-to-confirm.</p>
  <div id="box" data-br="lasso" style="max-width:700px;padding:24px;border-radius:24px;outline-offset:-4px;min-height:340px">
    <ul class="br-rows" id="l"></ul>
  </div>
</div>
<script>
var R=Brolly.Rows;
document.getElementById('l').innerHTML=['Write the thing','Reply to the email','Book the dentist','Think about lunch','Water the plant','Alphabetise the spices'].map(function(t,i){return R.html({id:'t'+i,title:t,meta:'Nothing to see here'});}).join('');
Brolly.init();
document.getElementById('box').addEventListener('br-bulk',function(e){Brolly.toast({title:e.detail.action+' · '+e.detail.items.length,detail:'As requested.',tone:e.detail.action==='delete'?'info':'success'});});
</script>
</body></html>
